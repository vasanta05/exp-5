
name: Student Placement Continuous Delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train and save ML model
        run: python train_model.py

      - name: Run Flask API tests
        run: python -m unittest discover -v

      - name: Prepare release package
        run: |
          mkdir -p release
          cp app.py requirements.txt release/
          cp artifacts/placement_model.joblib release/

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: student-placement-release
          path: release/
          if-no-files-found: error
          retention-days: 7
